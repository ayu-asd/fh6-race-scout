<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FH6 赛事速览 · 赛道图查询</title>
    <script>window.Module = {};</script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>FH6 赛事速览</h1>
      <div class="header-right">
        <span id="engine-status" class="status-dot">模型未加载</span>
        <button id="debug-toggle" class="ghost" title="显示裁剪区域和识别原文">调试</button>
        <a class="github-link" href="https://github.com/ayu-asd/fh6-race-scout" target="_blank" rel="noopener" title="GitHub 仓库">
          <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </header>

    <main>
      <section id="manual-wrap">
        <h2>手动查询</h2>
        <div class="manual-row">
          <div class="manual-box">
            <input id="manual-search" placeholder="输入赛事名（支持中文/英文/分类），也可直接 Ctrl+V 粘贴截图" autocomplete="off" />
            <div id="manual-results" hidden></div>
          </div>
          <button id="sample-btn" class="ghost" title="查看示例：什么截图能用">示例截图</button>
        </div>
      </section>

      <section id="upload-wrap">
        <input type="file" id="file-input" name="file-input" accept="image/*" />
        <p class="dz-hint">在游戏赛事报名界面按 Win+Shift+S 截取全屏（需包含左侧比赛列表）</p>
      </section>

      <section id="preview-wrap" hidden>
        <div class="preview-head">
          <span id="shot-info"></span>
          <button id="reset-btn" class="ghost">重新粘贴</button>
        </div>
        <div class="canvas-holder"><canvas id="preview"></canvas></div>
        <div id="raw-text" class="raw-text" hidden></div>
      </section>

      <section id="results" hidden></section>
    </main>

    <div id="sample-modal" hidden>
      <div class="sample-inner">
        <button id="sample-close" class="ghost">关闭 ✕</button>
        <img id="sample-img" src="./sample-screenshot.png" alt="示例：赛事报名界面截图" />
      </div>
    </div>
    <div id="progress" hidden><div class="spinner"></div><span id="progress-text">处理中…</span></div>
    <div id="toast" hidden></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
